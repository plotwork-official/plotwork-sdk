name: Publish Python

# Publishes the Python package `plotwork` to PyPI with trusted publishing: PyPI trusts this workflow in this repository through
# GitHub's OIDC token, so no PyPI token exists anywhere, and every file carries a PEP 740 attestation that names this commit.
#
# Push a tag `python-v<version>`, such as `python-v0.1.0`. The version must equal `python/pyproject.toml`, or nothing is published.
# On PyPI, the trusted publisher names: project `plotwork`, owner `plotwork-official`, repository `plotwork-sdk`, workflow
# `publish-python.yml`, environment `pypi`.

on:
  push:
    tags: ['python-v*']

permissions:
  contents: read

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Read the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#python-v}"
          declared="$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml', 'rb'))['project']['version'])")"
          if [ "$declared" != "$version" ]; then echo "Tag says $version, python/pyproject.toml says $declared" >&2; exit 1; fi
          package="$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('python/src/plotwork/_version.py').read()).group(1))")"
          if [ "$package" != "$version" ]; then echo "Tag says $version, python/src/plotwork/_version.py says $package" >&2; exit 1; fi
      - name: Install the build and test tools (exact versions)
        working-directory: python
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 build==1.6.1 mypy==2.4.1
      - name: The generated types are current
        run: node scripts/gen-python.mjs --check
      - name: No runtime dependencies
        run: node scripts/check-no-runtime-dependencies.mjs
      - name: Test
        working-directory: python
        run: python -m pytest
      - name: Type check
        working-directory: python
        run: python -m mypy --strict src/plotwork tests
      - name: Build
        working-directory: python
        run: python -m build --outdir dist .
      - name: The wheel requires nothing
        working-directory: python
        run: |
          if unzip -p dist/*.whl '*.dist-info/METADATA' | grep -q '^Requires-Dist:'; then echo 'The wheel declares a Requires-Dist' >&2; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/plotwork/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - name: Publish with attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
