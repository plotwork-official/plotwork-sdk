name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit
        run: pnpm audit --prod --audit-level high
      - name: Type check, test, and the no-runtime-dependency guard
        run: pnpm check
        env:
          VITEST_MAX_WORKERS: 4
      - name: Build
        run: pnpm build
      - name: Pack each published package
        run: pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination ../../dist-packs

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the build and test tools (exact versions)
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 build==1.6.1 mypy==2.4.1
      - name: Test
        working-directory: python
        run: python -m pytest
      - name: Type check
        working-directory: python
        run: python -m mypy --strict src/plotwork tests
      - name: Build
        working-directory: python
        run: python -m build --outdir dist .
      - name: The wheel requires nothing
        working-directory: python
        run: |
          if unzip -p dist/*.whl '*.dist-info/METADATA' | grep -q '^Requires-Dist:'; then echo 'The wheel declares a Requires-Dist' >&2; exit 1; fi
