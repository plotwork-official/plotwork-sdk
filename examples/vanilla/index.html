<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plotwork viewer example</title>
    <style>
      body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: Canvas; color: CanvasText; color-scheme: light dark; }
      main { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
      plotwork-diagram { --plotwork-height: 420px; }
    </style>
    <script type="module" src="../../packages/viewer/dist/register.js"></script>
  </head>
  <body>
    <main>
      <h1>Checkout</h1>
      <p>A Plotwork picture shown with <code>&lt;plotwork-diagram&gt;</code>. Hover a box to trace its lines; the Web tier box opens part 2.</p>
      <plotwork-diagram id="checkout" src="../../spec/fixtures/checkout.svg" label="Checkout flow"></plotwork-diagram>
      <p id="said" role="status"></p>
    </main>
    <script type="module">
      const viewer = document.getElementById('checkout')
      const said = document.getElementById('said')
      viewer.addEventListener('plotwork-drill', (event) => {
        said.textContent = `Open part ${event.detail.part} for ${event.detail.name}`
      })
    </script>
  </body>
</html>
